<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="brand" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="128" y2="128">
      <stop offset="0" stop-color="#FF4F64"/>
      <stop offset="0.55" stop-color="#E03A9E"/>
      <stop offset="1" stop-color="#7B3FF2"/>
    </linearGradient>
    <radialGradient id="shine" cx="0.22" cy="0.12" r="0.9">
      <stop offset="0" stop-color="#fff" stop-opacity="0.32"/>
      <stop offset="0.6" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <filter id="lift" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="2.5" stdDeviation="2.5" flood-color="#3b0a52" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect width="128" height="128" rx="30" fill="url(#brand)"/>
  <rect width="128" height="128" rx="30" fill="url(#shine)"/>

  <!-- three playlists already ticked -->
  <g filter="url(#lift)" fill="#fff">
    <rect x="20" y="20" width="38" height="38" rx="9"/>
    <rect x="70" y="20" width="38" height="38" rx="9"/>
    <rect x="20" y="70" width="38" height="38" rx="9"/>
  </g>
  <g fill="none" stroke="url(#brand)" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M30 40l6.5 6.5L48.5 33"/>
    <path d="M80 40l6.5 6.5L98.5 33"/>
    <path d="M30 90l6.5 6.5L48.5 83"/>
  </g>

  <!-- and room for one more -->
  <rect x="72" y="72" width="34" height="34" rx="7.5" fill="#fff" fill-opacity="0.14" stroke="#fff" stroke-width="4"/>
  <path d="M89 80.5v17M80.5 89h17" stroke="#fff" stroke-width="4.5" stroke-linecap="round"/>
</svg>
